services:
  db:
    image: postgres:16-alpine
    container_name: civitas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-civitas_db}
    # En desarrollo el puerto 5432 está expuesto al host para herramientas como DBeaver o Prisma Studio
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-civitas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - civitas-dev-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: civitas-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-civitas_db}?schema=public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
      - /app/node_modules
    networks:
      - civitas-dev-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: civitas-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/node_modules
    networks:
      - civitas-dev-network

volumes:
  postgres_data:

networks:
  civitas-dev-network:
    driver: bridge
