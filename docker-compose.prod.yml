services:
  db:
    image: postgres:16-alpine
    container_name: civitas-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # En producción la base de datos NO se expone a internet público; solo accesible por backend
    expose:
      - "5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - civitas-prod-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: civitas-backend-prod
    restart: always
    # Puerto interno accesible por Nginx y opcionalmente mapeado
    expose:
      - "3000"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - civitas-prod-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    container_name: civitas-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - civitas-prod-network

volumes:
  postgres_data_prod:

networks:
  civitas-prod-network:
    driver: bridge
